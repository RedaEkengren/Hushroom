server {
    server_name example.org;

    # --- Security headers ---
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(), payment=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' wss://example.org; media-src 'self' blob:; worker-src 'self' blob:; frame-ancestors 'none';" always;

    root /opt/example.org/frontend/dist;
    index index.html;

    location /api/internal/ {
        return 403;
    }

    # PWA paths from removed Sprint 12 — return 410 Gone so any client
    # with a stale service worker registered cleanly invalidates it
    # instead of getting an HTML SPA-fallback (wrong MIME type).
    location = /sw.js { return 410; }
    location = /manifest.webmanifest { return 410; }
    location = /registerSW.js { return 410; }
    location ~ ^/workbox-[a-z0-9]+\.js$ { return 410; }

    location /api/ {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
    }

    location /livekit/ {
        proxy_pass http://127.0.0.1:7880/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    location /health {
        proxy_pass http://127.0.0.1:3010;
    }

    # Sprint 20 — cache strategy: index.html must always re-validate so users
    # see new bundles after deploy without hard-refresh. Hashed assets are
    # safe to cache long since their filenames change on every build.
    location = /index.html {
        expires -1;
    }

    location ^~ /assets/ {
        expires 1y;
        access_log off;
    }

    # Images and fonts are not content-hashed but change rarely.
    location ~* \.(webp|png|jpg|jpeg|svg|ico|woff2)$ {
        expires 30d;
        access_log off;
    }

    # Prerendering (2026-08-26) added one static index.html per route, so
    # try_files now resolves /sakerhet to dist/sakerhet/index.html. Those pages
    # need the same rule as /index.html: always revalidate, otherwise a browser
    # can serve a cached page whose asset hashes were deleted by the next
    # deploy. The exact-match block above only covers /index.html itself.
    # $uri/index.html rather than $uri/: prerendering (2026-08-26) put a real
    # directory at dist/sakerhet/, and with $uri/ nginx answers /sakerhet with a
    # 301 to /sakerhet/ before serving it. That contradicts the canonical URL,
    # the sitemap and every internal link, and costs a round trip on every
    # sub-page. Naming the file directly serves it with no redirect.
    location / {
        try_files $uri $uri/index.html /index.html;
        expires -1;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/example.org/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/example.org/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    server_name www.example.org;
    return 301 https://example.org$request_uri;

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/example.org/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/example.org/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

# Wildcard subdomain block for *.example.org (tenant subdomains)
