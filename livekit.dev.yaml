# LOCAL DEV LiveKit config (used by docker-compose.dev.yml). No TLS, no TURN.
# Keys come from LIVEKIT_KEYS env (devkey / devsecret…) set in docker-compose.dev.yml.
port: 7880
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50100
  use_external_ip: false
  enable_loopback_candidate: true
logging:
  level: info
